<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-label="측정 시스템 하드웨어 구성"><rect x="0" y="0" width="900" height="250" fill="#ffffff"/><g font-family="'Helvetica Neue',Helvetica,Arial,'Malgun Gothic',sans-serif" fill="#111111"><rect x="26" y="44" width="104" height="34" fill="none" stroke="#666666" stroke-width="0.9"/><text x="38" y="59" font-size="10.5" font-weight="700">RA</text><text x="38" y="71" font-size="8.8" fill="#666666">줄기 상부</text><line x1="130" y1="61" x2="170" y2="61" stroke="#111111" stroke-width="0.9"/><path d="M169.5,58 L176,61 L169.5,64 Z" fill="#111111"/><rect x="26" y="90" width="104" height="34" fill="none" stroke="#666666" stroke-width="0.9"/><text x="38" y="105" font-size="10.5" font-weight="700">LA</text><text x="38" y="117" font-size="8.8" fill="#666666">줄기 하부</text><line x1="130" y1="107" x2="170" y2="107" stroke="#111111" stroke-width="0.9"/><path d="M169.5,104 L176,107 L169.5,110 Z" fill="#111111"/><rect x="26" y="136" width="104" height="34" fill="none" stroke="#666666" stroke-width="0.9"/><text x="38" y="151" font-size="10.5" font-weight="700">RL</text><text x="38" y="163" font-size="8.8" fill="#666666">흙 · 기준</text><line x1="130" y1="153" x2="170" y2="153" stroke="#111111" stroke-width="0.9"/><path d="M169.5,150 L176,153 L169.5,156 Z" fill="#111111"/><rect x="176" y="44" width="168" height="138" fill="none" stroke="#a5342b" stroke-width="1.4"/><text x="260.0" y="62" font-size="10.5" font-weight="700" text-anchor="middle">AD8232</text><text x="260.0" y="78" font-size="8.8" fill="#666666" text-anchor="middle">생체전위 증폭기</text><text x="260.0" y="91" font-size="8.8" fill="#666666" text-anchor="middle">이득 1100 배</text><text x="260.0" y="104" font-size="8.8" fill="#666666" text-anchor="middle">(계측증폭기 100 × 필터단 11)</text><text x="260.0" y="117" font-size="8.8" fill="#666666" text-anchor="middle">아날로그 대역 0.5 – 40 Hz</text><text x="260.0" y="130" font-size="8.8" fill="#666666" text-anchor="middle">RLD 능동 피드백 내장</text><line x1="344" y1="108" x2="432" y2="108" stroke="#111111" stroke-width="0.9"/><path d="M431.5,105 L438,108 L431.5,111 Z" fill="#111111"/><text x="391.0" y="102" font-size="8.5" fill="#666666" text-anchor="middle">OUTPUT 0–3.3 V</text><rect x="438" y="66" width="150" height="94" fill="none" stroke="#111111" stroke-width="0.9"/><text x="513.0" y="84" font-size="10.5" font-weight="700" text-anchor="middle">ADS1115</text><text x="513.0" y="100" font-size="8.8" fill="#666666" text-anchor="middle">16 bit ADC · A0</text><text x="513.0" y="113" font-size="8.8" fill="#666666" text-anchor="middle">860 SPS · 연속변환</text><text x="513.0" y="126" font-size="8.8" fill="#666666" text-anchor="middle">PGA ±4.096 V</text><line x1="588" y1="108" x2="668" y2="108" stroke="#111111" stroke-width="0.9"/><path d="M667.5,105 L674,108 L667.5,111 Z" fill="#111111"/><text x="631.0" y="102" font-size="8.5" fill="#666666" text-anchor="middle">I²C 400 kHz</text><rect x="674" y="66" width="150" height="94" fill="none" stroke="#111111" stroke-width="0.9"/><text x="749.0" y="84" font-size="10.5" font-weight="700" text-anchor="middle">라즈베리파이 5</text><text x="749.0" y="100" font-size="8.8" fill="#666666" text-anchor="middle">I2C1 · 3·5번 핀</text><text x="749.0" y="113" font-size="8.8" fill="#666666" text-anchor="middle">250 Hz 수집</text><text x="749.0" y="126" font-size="8.8" fill="#666666" text-anchor="middle">Flask 대시보드</text><line x1="26" y1="212" x2="874" y2="212" stroke="#aaaaaa" stroke-width="0.7"/><text x="26" y="230" font-size="9" fill="#666666">RL 은 단순 접지가 아니라 RLD 피드백의 출력단이다. 이 전극이 기준 전위를 잡지 못하면 증폭기 출력이 전원 레일에 붙어 측정이 성립하지 않는다.</text></g></svg>