256 mV</text><text x="376.0" y="94" font-size="8.8" fill="#666666" text-anchor="middle">resolution 7.81 µV</text><text x="376.0" y="107" font-size="8.8" fill="#666666" text-anchor="middle"></text><text x="376.0" y="120" font-size="8.8" fill="#666666" text-anchor="middle">two differential pairs —</text><text x="376.0" y="133" font-size="8.8" fill="#666666" text-anchor="middle">A2−A3 is the last one</text><line x1="452" y1="158" x2="506" y2="158" stroke="#111111" stroke-width="0.9"/><path d="M505.5,155 L512,158 L505.5,161 Z" fill="#111111"/><text x="482.0" y="152" font-size="8.5" fill="#666666" text-anchor="middle">I²C 400 kHz</text><rect x="512" y="112" width="152" height="92" fill="none" stroke="#111111" stroke-width="0.9"/><text x="588.0" y="130" font-size="10.5" font-weight="700" text-anchor="middle">Raspberry Pi 5</text><text x="588.0" y="146" font-size="8.8" fill="#666666" text-anchor="middle">5 Hz for slow runs</text><text x="588.0" y="159" font-size="8.8" fill="#666666" text-anchor="middle">records voltage_ref</text><text x="588.0" y="172" font-size="8.8" fill="#666666" text-anchor="middle">subtracts before training</text><text x="20" y="30" font-size="9.5" font-weight="700">PLANT</text><text x="20" y="172" font-size="9.5" font-weight="700" fill="#a5342b">REFERENCE — dead stem or gel only, no plant</text><text x="712" y="34" font-size="9.5" font-weight="700">MID-SUPPLY BIAS</text><text x="712" y="56" font-size="9">3.3 V</text><line x1="726.0" y1="60.0" x2="726.0" y2="82.0" stroke="#111111" stroke-width="0.9"/><rect x="718" y="82" width="16" height="38" fill="none" stroke="#111111" stroke-width="0.9"/><text x="740" y="105" font-size="8.5" fill="#666666">100 kΩ</text><rect x="718" y="178" width="16" height="38" fill="none" stroke="#111111" stroke-width="0.9"/><text x="740" y="201" font-size="8.5" fill="#666666">100 kΩ</text><line x1="726.0" y1="120.0" x2="726.0" y2="178.0" stroke="#111111" stroke-width="0.9"/><line x1="726.0" y1="216.0" x2="726.0" y2="242.0" stroke="#111111" stroke-width="0.9"/><circle cx="726.0" cy="144.0" r="2.3" fill="#111111"/><line x1="726.0" y1="144.0" x2="822.0" y2="144.0" stroke="#111111" stroke-width="0.9"/><text x="826" y="140" font-size="9.5" font-weight="700">1.65 V</text><text x="826" y="153" font-size="8.5" fill="#666666">→ soil electrode</text><circle cx="782.0" cy="144.0" r="2.3" fill="#111111"/><line x1="782.0" y1="144.0" x2="782.0" y2="170.0" stroke="#111111" stroke-width="0.9"/><line x1="771" y1="170" x2="793" y2="170" stroke="#111111" stroke-width="1.2"/><line x1="771" y1="176" x2="793" y2="176" stroke="#111111" stroke-width="1.2"/><text x="798" y="177" font-size="8.5" fill="#666666">0.1 µF</text><line x1="782.0" y1="176.0" x2="782.0" y2="242.0" stroke="#111111" stroke-width="0.9"/><line x1="726.0" y1="242.0" x2="782.0" y2="242.0" stroke="#111111" stroke-width="0.9"/><line x1="740.0" y1="242" x2="768.0" y2="242" stroke="#111111" stroke-width="1.5"/><line x1="746.0" y1="247" x2="762.0" y2="247" stroke="#111111" stroke-width="1.2"/><line x1="751.0" y1="252" x2="757.0" y2="252" stroke="#111111" stroke-width="1.2"/><text x="774.0" y="250" font-size="8.5" fill="#666666">GND</text><text x="20" y="322" font-size="8.6" fill="#666666">Buffers do not amplify (×1); they only lower the source impedance. There is no high-pass stage, so 10⁻⁴ Hz survives to the ADC.</text><text x="20" y="336" font-size="8.6" fill="#a5342b">The reference pair sits in the same environment with no plant, so subtracting it cancels the drift common to both pairs.</text></g></svg>