<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>식물 신호 판정</title>
<style>
/* ── 색은 전부 여기서만 정한다. 화면 코드는 역할 이름만 쓴다. ───────────── */
:root {
  color-scheme: light;
  --bg:            #f3f3f1;
  --surface:       #fcfcfb;
  --line:          #d9d8d3;
  --grid:          #ebeae6;
  --text-primary:  #0b0b0b;
  --text-secondary:#52514e;
  --text-muted:    #8a8984;
  --track:         #ebeae6;
  --trace:         #2a78d6;
  /* 상태 색 (범주형 1~3번 슬롯, 검증 통과: 명시 라벨 동반) */
  --st-a:          #1baf7a;   /* 정상 / 비접촉 */
  --st-b:          #eb6834;   /* 자극 / 접촉 */
  --st-c:          #2a78d6;   /* 수분부족 */
  --st-unknown:    #a3a29c;
  --critical:      #d03b3b;
  --warning:       #fab219;
  --good:          #0ca30c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg:            #121211;
    --surface:       #1a1a19;
    --line:          #33332f;
    --grid:          #262624;
    --text-primary:  #f0efec;
    --text-secondary:#c3c2b7;
    --text-muted:    #8f8e86;
    --track:         #2a2a27;
    --trace:         #3987e5;
    --st-a:          #199e70;
    --st-b:          #d95926;
    --st-c:          #3987e5;
    --st-unknown:    #6d6c66;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:            #121211;
  --surface:       #1a1a19;
  --line:          #33332f;
  --grid:          #262624;
  --text-primary:  #f0efec;
  --text-secondary:#c3c2b7;
  --text-muted:    #8f8e86;
  --track:         #2a2a27;
  --trace:         #3987e5;
  --st-a:          #199e70;
  --st-b:          #d95926;
  --st-c:          #3987e5;
  --st-unknown:    #6d6c66;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.45;
}
.wrap { max-width: 1280px; margin: 0 auto; padding: 16px; }

/* ── 머리줄 ── */
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  border: 1px solid var(--line); background: var(--surface);
  padding: 10px 14px; margin-bottom: 12px;
}
header h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); padding: 2px 8px; font-size: 12px; font-weight: 600;
}
.badge .dot { width: 8px; height: 8px; background: var(--text-muted); }
.badge[data-kind="live"] .dot { background: var(--good); }
.badge[data-kind="demo"] { border-color: var(--critical); color: var(--critical); }
.badge[data-kind="demo"] .dot { background: var(--critical); }
.badge[data-kind="paused"] .dot { background: var(--warning); }
.badge[data-kind="down"] .dot { background: var(--critical); }
.meta { color: var(--text-secondary); font-size: 12px; font-variant-numeric: tabular-nums; }
.spacer { flex: 1; }
button {
  font: inherit; font-size: 12px; color: var(--text-primary);
  background: var(--surface); border: 1px solid var(--line);
  padding: 4px 10px; cursor: pointer; border-radius: 0;
}
button:hover { border-color: var(--text-secondary); }
button[aria-pressed="true"] { background: var(--text-primary); color: var(--surface); border-color: var(--text-primary); }

/* ── 네모 칸 배치 ── */
.grid {
  display: grid; gap: 12px;
  grid-template-columns: minmax(300px, 380px) 1fr;
  grid-template-rows: auto auto;
  grid-template-areas: "gauge spec" "gauge volt";
}
.tile {
  background: var(--surface); border: 1px solid var(--line);
  display: flex; flex-direction: column; min-width: 0;
}
.tile > .hd {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px;
  padding: 8px 12px; border-bottom: 1px solid var(--line);
}
.tile > .hd h2 { font-size: 13px; margin: 0; font-weight: 700; white-space: nowrap; }
.tile > .hd .sub { font-size: 12px; color: var(--text-muted); }
.tile > .bd { padding: 12px; position: relative; flex: 1; }
.t-gauge { grid-area: gauge; }
.t-spec  { grid-area: spec; }
.t-volt  { grid-area: volt; }
@media (max-width: 820px) {
  .grid { grid-template-columns: 1fr; grid-template-areas: "gauge" "spec" "volt"; }
}

/* ── 게이지 ── */
.gauge-box { display: flex; justify-content: center; }
.gauge { width: 100%; max-width: 300px; aspect-ratio: 1; }
.gauge .track { fill: none; stroke: var(--track); stroke-width: 18; }
.gauge .arc   { fill: none; stroke-width: 18; stroke-linecap: butt;
                transition: stroke-dasharray .45s ease, stroke .6s ease; }
.gauge .pct   { font-size: 54px; font-weight: 800; fill: var(--text-primary);
                font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.gauge .state { font-size: 20px; font-weight: 700; fill: var(--text-primary); }
.gauge .cap   { font-size: 12px; fill: var(--text-muted); }

.probs { margin-top: 14px; display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: 14px 72px 1fr 52px; align-items: center; gap: 8px; font-size: 13px; }
.prow .sw { width: 12px; height: 12px; }
.prow .bar { height: 10px; background: var(--track); position: relative; }
.prow .bar > i { position: absolute; inset: 0 auto 0 0; transition: width .45s ease; }
.prow .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-secondary); }

.hist-label { margin-top: 16px; font-size: 12px; color: var(--text-muted); display: flex; justify-content: space-between; }
.hist { margin-top: 6px; display: grid; grid-template-columns: repeat(60, 1fr); gap: 2px; }
.hist > i { aspect-ratio: 1; background: var(--track); }

/* ── 캔버스 칸 ── */
.plot { position: relative; width: 100%; }
.t-spec .plot { height: 280px; }
.t-volt .plot { height: 220px; }
canvas { display: block; width: 100%; height: 100%; }

.tip {
  position: absolute; pointer-events: none; z-index: 5; display: none;
  background: var(--surface); color: var(--text-primary);
  border: 1px solid var(--text-secondary); padding: 4px 8px; font-size: 12px;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}

/* ── 연결 안 됨 안내 ── */
.overlay {
  position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--bg) 82%, transparent); z-index: 20; padding: 16px;
}
.overlay.show { display: flex; }
.overlay .card { background: var(--surface); border: 1px solid var(--line); padding: 20px; max-width: 420px; }
.overlay h3 { margin: 0 0 8px; font-size: 15px; }
.overlay p { margin: 0 0 14px; color: var(--text-secondary); font-size: 13px; }
.overlay .row { display: flex; gap: 8px; flex-wrap: wrap; }
code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>식물 신호 실시간 판정</h1>
    <span class="badge" id="conn" data-kind="down"><span class="dot"></span><span id="connText">연결 전</span></span>
    <span class="meta" id="metaRate">— S/s</span>
    <span class="meta" id="metaBand">대역 —</span>
    <span class="meta" id="metaWin">창 —</span>
    <span class="spacer"></span>
    <button id="shapeCi" aria-pressed="true">원</button>
    <button id="shapeSq" aria-pressed="false">네모</button>
    <button id="themeBtn">화면 밝기</button>
  </header>

  <div class="grid">
    <!-- 판정 게이지 -->
    <section class="tile t-gauge">
      <div class="hd"><h2>현재 판정</h2><span class="sub" id="gaugeSub">가장 높은 확률</span></div>
      <div class="bd">
        <div class="gauge-box">
          <svg class="gauge" viewBox="0 0 240 240" role="img" aria-labelledby="gaugeTitle">
            <title id="gaugeTitle">현재 판정과 확률</title>
            <path class="track" id="gTrack"></path>
            <path class="arc" id="gArc" pathLength="100" stroke-dasharray="0 100"></path>
            <text class="pct"   x="120" y="122" text-anchor="middle" id="gPct">—</text>
            <text class="state" x="120" y="152" text-anchor="middle" id="gState">대기 중</text>
            <text class="cap"   x="120" y="174" text-anchor="middle" id="gCap"></text>
          </svg>
        </div>
        <div class="probs" id="probs"></div>
        <div class="hist-label"><span>최근 판정</span><span id="histSpan">—</span></div>
        <div class="hist" id="hist"></div>
      </div>
    </section>

    <!-- 스펙트로그램 -->
    <section class="tile t-spec">
      <div class="hd">
        <h2>스펙트로그램</h2><span class="sub" id="specSub">0.5–20 Hz 대역통과 후 (분류기 입력 대역)</span>
      </div>
      <div class="bd"><div class="plot" id="specPlot"><canvas id="specCv"></canvas><div class="tip" id="specTip"></div></div></div>
    </section>

    <!-- 전압 -->
    <section class="tile t-volt">
      <div class="hd"><h2>전위</h2><span class="sub" id="voltSub">최근 10초 · mV</span></div>
      <div class="bd"><div class="plot" id="voltPlot"><canvas id="voltCv"></canvas><div class="tip" id="voltTip"></div></div></div>
    </section>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="card">
    <h3>측정 서버에 연결되지 않았습니다</h3>
    <p><code id="srcText">/data</code> 에서 응답이 없습니다. 라즈베리파이의 대시보드가 켜져 있는지 확인하세요.
       데모는 화면 확인용 가짜 신호이며, 데모로 보는 동안에는 위에 <b>데모 데이터 — 실측 아님</b>이 계속 표시됩니다.</p>
    <div class="row">
      <button id="retryBtn">다시 연결</button>
      <button id="demoBtn">데모 데이터로 보기</button>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";

/* ════════════════ 설정 ════════════════
   기존 web_dashboard.py 의 /data 응답을 그대로 쓴다.
   필요한 필드: state, proba, probs, classes, signal(V), signal_hz,
               spec(주파수×시간, dB), band, window_sec, actual_rate, paused, paused_by
   다른 주소를 쓰려면 ?src=http://파이주소:5000/data  */
const params   = new URLSearchParams(location.search);
const SOURCE   = params.get("src") || "/data";
const POLL_MS  = 500;
const VIEW_SEC = 10;                 // 전위 그래프에 보이는 시간
const HIST_N   = 60;                 // 최근 판정 칸 수

/* 상태 이름 → 색 역할. 모르는 이름은 순서대로 a, b, c 를 받는다. */
const KNOWN = { "정상": "--st-a", "비접촉": "--st-a", "자극": "--st-b", "접촉": "--st-b", "수분부족": "--st-c" };
const ORDER = ["--st-a", "--st-b", "--st-c"];
const colorRole = new Map();
function roleFor(name) {
  if (colorRole.has(name)) return colorRole.get(name);
  let r = KNOWN[name];
  if (!r) {
    const used = new Set(colorRole.values());
    r = ORDER.find(x => !used.has(x)) || "--st-unknown";
  }
  colorRole.set(name, r);
  return r;
}
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

/* ════════════════ 상태 ════════════════ */
let mode = "connecting";             // connecting | live | demo | down
let fails = 0, timer = null, lastPollT = 0;
const volt = { t: [], v: [] };       // 초, mV
let tNow = 0;                        // 화면 기준 시각(초)
let latest = null;
const hist = [];

/* ════════════════ 머리줄 ════════════════ */
const $ = id => document.getElementById(id);
function setConn(kind, text) {
  $("conn").dataset.kind = kind;
  $("connText").textContent = text;
}
$("srcText").textContent = SOURCE;

/* ════════════════ 게이지 모양 (원 / 네모) ════════════════
   어느 모양이든 12시 방향에서 시작해 시계 방향으로 채운다. 고른 모양은 이 브라우저에 기억한다. */
let shape = "ci";
try { if (localStorage.getItem("gaugeShape") === "sq") shape = "sq"; } catch (e) {}
function gaugePath(s) {
  const c = 120, h = 98;             // 중심, 반지름(반폭)
  if (s === "sq") {
    const L = c - h, R = c + h, T = c - h, B = c + h;
    return `M ${c} ${T} L ${R} ${T} L ${R} ${B} L ${L} ${B} L ${L} ${T} Z`;
  }
  return `M ${c} ${c - h} A ${h} ${h} 0 1 1 ${c - 0.01} ${c - h}`;
}
function applyShape() {
  $("gTrack").setAttribute("d", gaugePath(shape));
  $("gArc").setAttribute("d", gaugePath(shape));
  $("shapeCi").setAttribute("aria-pressed", shape === "ci");
  $("shapeSq").setAttribute("aria-pressed", shape === "sq");
  try { localStorage.setItem("gaugeShape", shape); } catch (e) {}
}
$("shapeCi").onclick = () => { shape = "ci"; applyShape(); };
$("shapeSq").onclick = () => { shape = "sq"; applyShape(); };
applyShape();

$("themeBtn").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme
    ? root.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  render();
};

/* ════════════════ 판정 영역 ════════════════ */
function probsAsList(d) {
  const cls = d.classes || [];
  if (Array.isArray(d.probs)) return cls.map((c, i) => [c, +d.probs[i] || 0]);
  if (d.probs && typeof d.probs === "object") return cls.map(c => [c, +d.probs[c] || 0]);
  return cls.map(c => [c, c === d.state ? (+d.proba || 0) : 0]);
}
function renderGauge() {
  const d = latest;
  if (!d || !d.ready) {
    $("gArc").setAttribute("stroke-dasharray", "0 100");
    $("gPct").textContent = "—"; $("gState").textContent = d && d.paused ? "일시정지" : "대기 중";
    $("gCap").textContent = d && d.paused_by ? d.paused_by : "";
    return;
  }
  const p = Math.max(0, Math.min(1, +d.proba || 0));
  const col = css(roleFor(d.state));
  const arc = $("gArc");
  arc.style.stroke = col;
  arc.setAttribute("stroke-dasharray", `${(p * 100).toFixed(1)} 100`);
  $("gPct").textContent = `${Math.round(p * 100)}%`;
  $("gState").textContent = d.state;
  $("gCap").textContent = d.paused ? "일시정지" : `${d.window_sec || 10}초 창 기준`;

  const box = $("probs");
  const rows = probsAsList(d);
  box.innerHTML = "";
  for (const [name, v] of rows) {
    const c = css(roleFor(name));
    const row = document.createElement("div");
    row.className = "prow";
    row.innerHTML = `<span class="sw" style="background:${c}"></span><span>${name}</span>
      <span class="bar"><i style="width:${(v * 100).toFixed(1)}%;background:${c}"></i></span>
      <span class="v">${(v * 100).toFixed(1)}%</span>`;
    box.appendChild(row);
  }
}
function pushHist(d) {
  if (!d || !d.ready) return;
  hist.push({ s: d.state, p: +d.proba || 0 });
  while (hist.length > HIST_N) hist.shift();
}
function renderHist() {
  const box = $("hist");
  if (box.children.length !== HIST_N) {
    box.innerHTML = "";
    for (let i = 0; i < HIST_N; i++) box.appendChild(document.createElement("i"));
  }
  const off = HIST_N - hist.length;
  [...box.children].forEach((el, i) => {
    const h = hist[i - off];
    el.style.background = h ? css(roleFor(h.s)) : "";
    el.style.opacity = h ? (0.35 + 0.65 * h.p).toFixed(2) : "";
    el.title = h ? `${h.s} ${Math.round(h.p * 100)}%` : "";
  });
  $("histSpan").textContent = `${(HIST_N * POLL_MS / 1000).toFixed(0)}초 · 한 칸 ${POLL_MS / 1000}초`;
}

/* ════════════════ 캔버스 공통 ════════════════ */
function fit(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { g, w: r.width, h: r.height };
}
function niceTicks(lo, hi, n) {
  const span = hi - lo || 1, raw = span / n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || raw;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
const PAD = { l: 52, r: 12, t: 8, b: 26 };

/* ════════════════ 전위 그래프 ════════════════ */
let voltHover = null;
function renderVolt() {
  const { g, w, h } = fit($("voltCv"));
  const pw = w - PAD.l - PAD.r, ph = h - PAD.t - PAD.b;
  g.clearRect(0, 0, w, h);
  // 요청 사이(0.5초)에도 부드럽게 흐르도록 한 요청 간격만큼 늦춰 보여 준다.
  const lag = POLL_MS / 1000;
  const tDisp = mode === "down" ? tNow : tNow - lag + Math.min(lag, performance.now() / 1000 - lastPollT);
  const t0 = tDisp - VIEW_SEC;
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < volt.t.length; i++) if (volt.t[i] >= t0) { lo = Math.min(lo, volt.v[i]); hi = Math.max(hi, volt.v[i]); }
  if (!isFinite(lo)) { lo = -1; hi = 1; }
  const padv = Math.max((hi - lo) * 0.12, 0.5);
  lo -= padv; hi += padv;
  const X = t => PAD.l + (t - t0) / VIEW_SEC * pw;
  const Y = v => PAD.t + (1 - (v - lo) / (hi - lo)) * ph;

  g.font = "11px system-ui, sans-serif";
  g.strokeStyle = css("--grid"); g.fillStyle = css("--text-muted"); g.lineWidth = 1;
  g.textAlign = "right"; g.textBaseline = "middle";
  for (const v of niceTicks(lo, hi, 4)) {
    const y = Math.round(Y(v)) + 0.5;
    g.beginPath(); g.moveTo(PAD.l, y); g.lineTo(PAD.l + pw, y); g.stroke();
    g.fillText(v.toFixed(Math.abs(hi - lo) < 5 ? 2 : 0), PAD.l - 6, y);
  }
  g.textAlign = "center"; g.textBaseline = "top";
  for (let s = -VIEW_SEC; s <= 0; s += 2) g.fillText(s === 0 ? "지금" : `${s}초`, PAD.l + (s + VIEW_SEC) / VIEW_SEC * pw, PAD.t + ph + 6);
  g.strokeStyle = css("--line");
  g.beginPath(); g.moveTo(PAD.l, PAD.t + ph + 0.5); g.lineTo(PAD.l + pw, PAD.t + ph + 0.5); g.stroke();

  g.save();
  g.beginPath(); g.rect(PAD.l, PAD.t, pw, ph); g.clip();
  g.strokeStyle = css("--trace"); g.lineWidth = 2; g.lineJoin = "round";
  g.beginPath();
  let started = false;
  // 화면 폭보다 점이 많으면 픽셀마다 최소·최대만 그려 모양을 보존한다.
  const step = Math.max(1, Math.floor(volt.t.length / (pw * 2)));
  for (let i = 0; i < volt.t.length; i += step) {
    if (volt.t[i] < t0 - 0.1) continue;
    const x = X(volt.t[i]), y = Y(volt.v[i]);
    started ? g.lineTo(x, y) : (g.moveTo(x, y), started = true);
  }
  g.stroke();
  if (voltHover && volt.t.length) {
    const tx = t0 + (voltHover.x - PAD.l) / pw * VIEW_SEC;
    let k = 0, best = Infinity;
    for (let i = 0; i < volt.t.length; i++) { const dd = Math.abs(volt.t[i] - tx); if (dd < best) { best = dd; k = i; } }
    const x = X(volt.t[k]), y = Y(volt.v[k]);
    g.strokeStyle = css("--text-muted"); g.lineWidth = 1;
    g.beginPath(); g.moveTo(Math.round(x) + 0.5, PAD.t); g.lineTo(Math.round(x) + 0.5, PAD.t + ph); g.stroke();
    g.fillStyle = css("--trace"); g.strokeStyle = css("--surface"); g.lineWidth = 2;
    g.beginPath(); g.arc(x, y, 4, 0, Math.PI * 2); g.fill(); g.stroke();
    const tip = $("voltTip");
    tip.style.display = "block";
    tip.textContent = `${(volt.t[k] - tDisp).toFixed(2)}초 · ${volt.v[k].toFixed(3)} mV`;
    tip.style.left = Math.min(x + 10, w - tip.offsetWidth - 4) + "px";
    tip.style.top = Math.max(0, y - 30) + "px";
  } else $("voltTip").style.display = "none";
  g.restore();
}
$("voltPlot").addEventListener("pointermove", e => { const r = e.currentTarget.getBoundingClientRect(); voltHover = { x: e.clientX - r.left }; });
$("voltPlot").addEventListener("pointerleave", () => { voltHover = null; });

/* ════════════════ 스펙트로그램 ════════════════
   보고서 그림6(나)와 같은 표현: matplotlib 기본 viridis, 색 범위는 이 창의 최솟값~최댓값,
   칸은 보간 없이 네모 그대로, 축 이름은 "주파수 (Hz)", "시간 (초)". */
const VIRIDIS = ["#440154", "#482475", "#414487", "#355f8d", "#2a788e", "#21918c",
                 "#22a884", "#44bf70", "#7ad151", "#bddf26", "#fde725"];
const hex = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16));
const LUT = (() => {
  const stops = VIRIDIS.map(hex), lut = new Uint8ClampedArray(256 * 3);
  for (let i = 0; i < 256; i++) {
    const f = i / 255 * (stops.length - 1), k = Math.min(stops.length - 2, Math.floor(f)), u = f - k;
    for (let c = 0; c < 3; c++) lut[i * 3 + c] = stops[k][c] + (stops[k + 1][c] - stops[k][c]) * u;
  }
  return lut;
})();
const SPAD = { l: 58, r: 12, t: 8, b: 44 };
let specHover = null;
function renderSpec() {
  const { g, w, h } = fit($("specCv"));
  g.clearRect(0, 0, w, h);
  const d = latest;
  const S = d && d.spec;
  const pw = w - SPAD.l - SPAD.r, ph = h - SPAD.t - SPAD.b;
  const fHi = d && d.band ? +d.band[1] : 20, win = d && d.window_sec ? +d.window_sec : 10;
  const ink = css("--text-primary");
  if (!S || !S.length || !S[0].length) {
    g.fillStyle = css("--text-muted"); g.font = "12px system-ui"; g.textAlign = "center";
    g.fillText("스펙트로그램 대기 중", w / 2, h / 2);
    return;
  }
  const nf = S.length, nt = S[0].length;
  let lo = Infinity, hi = -Infinity;
  for (const r of S) for (const v of r) { if (v < lo) lo = v; if (v > hi) hi = v; }
  const img = g.createImageData(nt, nf);
  for (let fi = 0; fi < nf; fi++) for (let ti = 0; ti < nt; ti++) {
    const u = Math.max(0, Math.min(1, (S[fi][ti] - lo) / (hi - lo || 1)));
    const k = Math.round(u * 255) * 3, o = ((nf - 1 - fi) * nt + ti) * 4;   // 낮은 주파수를 아래로
    img.data[o] = LUT[k]; img.data[o + 1] = LUT[k + 1]; img.data[o + 2] = LUT[k + 2]; img.data[o + 3] = 255;
  }
  const off = document.createElement("canvas"); off.width = nt; off.height = nf;
  off.getContext("2d").putImageData(img, 0, 0);
  g.imageSmoothingEnabled = false;
  g.drawImage(off, SPAD.l, SPAD.t, pw, ph);

  // 테두리와 바깥쪽 눈금 (matplotlib 기본 모양)
  g.strokeStyle = ink; g.lineWidth = 1;
  g.strokeRect(SPAD.l + 0.5, SPAD.t + 0.5, pw - 1, ph - 1);
  g.font = "12px system-ui, sans-serif"; g.fillStyle = ink;
  g.textAlign = "right"; g.textBaseline = "middle";
  for (const f of niceTicks(0, fHi, 2)) {
    const y = Math.round(SPAD.t + (1 - f / fHi) * ph) + 0.5;
    g.beginPath(); g.moveTo(SPAD.l, y); g.lineTo(SPAD.l - 5, y); g.stroke();
    g.fillText(`${f}`, SPAD.l - 8, y);
  }
  g.textAlign = "center"; g.textBaseline = "top";
  for (const s of niceTicks(-win, 0, 5)) {
    const x = Math.round(SPAD.l + (s + win) / win * pw) + 0.5;
    g.beginPath(); g.moveTo(x, SPAD.t + ph); g.lineTo(x, SPAD.t + ph + 5); g.stroke();
    g.fillText(`${s}`, x, SPAD.t + ph + 8);
  }
  g.fillText("시간 (초)", SPAD.l + pw / 2, SPAD.t + ph + 26);
  g.save(); g.translate(14, SPAD.t + ph / 2); g.rotate(-Math.PI / 2);
  g.textBaseline = "middle"; g.fillText("주파수 (Hz)", 0, 0); g.restore();

  const tip = $("specTip");
  if (specHover && specHover.x >= SPAD.l && specHover.x <= SPAD.l + pw && specHover.y >= SPAD.t && specHover.y <= SPAD.t + ph) {
    const ti = Math.min(nt - 1, Math.floor((specHover.x - SPAD.l) / pw * nt));
    const fi = Math.min(nf - 1, Math.floor((1 - (specHover.y - SPAD.t) / ph) * nf));
    const cx = SPAD.l + (ti + 0.5) / nt * pw, cy = SPAD.t + (1 - (fi + 0.5) / nf) * ph;
    g.strokeStyle = "#ffffff"; g.lineWidth = 1.5;
    g.strokeRect(SPAD.l + ti / nt * pw, SPAD.t + (nf - 1 - fi) / nf * ph, pw / nt, ph / nf);
    tip.style.display = "block";
    tip.textContent = `${((fi + 0.5) / nf * fHi).toFixed(1)} Hz · ${(((ti + 0.5) / nt - 1) * win).toFixed(1)}초 · ${S[fi][ti].toFixed(1)} dB`;
    tip.style.left = Math.min(cx + 12, w - tip.offsetWidth - 4) + "px";
    tip.style.top = Math.max(0, cy - 30) + "px";
  } else tip.style.display = "none";
}
$("specPlot").addEventListener("pointermove", e => { const r = e.currentTarget.getBoundingClientRect(); specHover = { x: e.clientX - r.left, y: e.clientY - r.top }; renderSpec(); });
$("specPlot").addEventListener("pointerleave", () => { specHover = null; renderSpec(); });

/* ════════════════ 데이터 받기 ════════════════ */
function ingest(d) {
  latest = d;
  const now = performance.now() / 1000;
  const dt = lastPollT ? now - lastPollT : POLL_MS / 1000;
  lastPollT = now;
  if (d.ready && Array.isArray(d.signal) && d.signal.length && !d.paused) {
    // 서버는 최근 몇 초를 통째로 보낸다. 지난 요청 이후 흐른 시간만큼만 이어붙인다.
    const hz = +d.signal_hz || 50;
    const k = Math.min(d.signal.length, Math.max(1, Math.round(dt * hz)));
    const tail = d.signal.slice(-k);
    for (let i = 0; i < tail.length; i++) {
      volt.t.push(tNow + (i + 1 - tail.length) / hz + dt);
      volt.v.push(tail[i] * 1000);          // V → mV
    }
    tNow += dt;
    const cut = tNow - VIEW_SEC - 1;
    let n = 0; while (n < volt.t.length && volt.t[n] < cut) n++;
    if (n) { volt.t.splice(0, n); volt.v.splice(0, n); }
  }
  pushHist(d);
  $("metaRate").textContent = d.actual_rate ? `${(+d.actual_rate).toFixed(1)} S/s` : (d.sample_rate ? `${d.sample_rate} S/s` : "— S/s");
  $("metaBand").textContent = d.band ? `대역 ${d.band[0]}–${d.band[1]} Hz` : "대역 —";
  $("metaWin").textContent = d.window_sec ? `창 ${d.window_sec}초` : "창 —";
  if (mode === "live") setConn(d.paused ? "paused" : "live", d.paused ? `일시정지${d.paused_by ? " · " + d.paused_by : ""}` : "실측 연결");
  render();
}
async function poll() {
  try {
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 2000);
    const r = await fetch(SOURCE, { cache: "no-store", signal: ctl.signal });
    clearTimeout(to);
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    fails = 0; mode = "live"; $("overlay").classList.remove("show");
    ingest(d);
  } catch (e) {
    fails++;
    if (fails >= 3) {
      // 끊겼을 때 가짜 신호로 바꾸지 않는다. 멈춘 채 "끊김"을 보여 준다.
      mode = "down"; setConn("down", "연결 끊김");
      stop(); $("overlay").classList.add("show");
    }
  }
}
function start(fn) { stop(); timer = setInterval(fn, POLL_MS); fn(); }
function stop() { if (timer) clearInterval(timer); timer = null; }
$("retryBtn").onclick = () => { fails = 0; mode = "connecting"; setConn("down", "연결 중…"); $("overlay").classList.remove("show"); start(poll); };
$("demoBtn").onclick = () => { $("overlay").classList.remove("show"); startDemo(); };

/* ════════════════ 데모(가짜 신호) ════════════════
   화면 확인 전용. 실측과 섞이지 않도록 배지를 빨갛게 고정한다. */
function startDemo() {
  mode = "demo"; setConn("demo", "데모 데이터 — 실측 아님");
  const FS = 250, WIN = 10, BAND = [0.5, 20];
  const buf = []; let base = -50, touch = 0, touchLeft = 0, t = 0;
  const N = 500, HOP = 50, NB = Math.floor(BAND[1] / (FS / N)) + 1;
  const hann = Float64Array.from({ length: N }, (_, i) => 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1)));
  function gen(n) {
    for (let i = 0; i < n; i++, t++) {
      if (!touchLeft && Math.random() < 1 / (FS * 9)) touchLeft = FS * (2 + Math.random() * 4);
      const target = touchLeft > 0 ? 275 : 0;
      if (touchLeft > 0) touchLeft--;
      touch += (target - touch) * 0.04;
      base += (Math.random() - 0.5) * 0.08;
      const v = base + touch + 0.6 * Math.sin(2 * Math.PI * 10 * t / FS) + (Math.random() - 0.5) * 0.4;
      buf.push(v / 1000);
    }
    while (buf.length > FS * WIN) buf.shift();
  }
  function stft() {
    // 실제 전처리처럼 0.5 Hz 아래를 걷어 낸 뒤 스펙트로그램을 만든다(1차 고역통과, 앞뒤로 한 번씩).
    const raw = buf.slice(-FS * WIN), cols = [], mean = 0;
    const al = 1 / (1 + 2 * Math.PI * BAND[0] / FS);
    const hp = arr => { const o = new Array(arr.length); let py = 0, px = arr[0]; for (let i = 0; i < arr.length; i++) { py = al * (py + arr[i] - px); px = arr[i]; o[i] = py; } return o; };
    const y = hp(hp(raw).reverse()).reverse();
    // 칸 중심이 0~10초를 고르게 덮도록 양 끝을 반 창씩 늘린다(전위 그래프와 시각을 맞춘다).
    const x = [...Array(N / 2).fill(y[0]), ...y, ...Array(N / 2).fill(y[y.length - 1])];
    for (let s = 0; s + N <= x.length; s += HOP) {
      const col = [];
      for (let k = 0; k < NB; k++) {
        let re = 0, im = 0;
        for (let i = 0; i < N; i++) { const a = (x[s + i] - mean) * 1000 * hann[i], w = -2 * Math.PI * k * i / N; re += a * Math.cos(w); im += a * Math.sin(w); }
        col.push(10 * Math.log10(re * re + im * im + 1e-6));
      }
      cols.push(col);
    }
    return Array.from({ length: NB }, (_, k) => cols.map(c => c[k]));   // 주파수×시간
  }
  gen(FS * WIN);
  // 처음부터 10초가 꽉 차 보이도록 버퍼를 그래프에 미리 깐다.
  volt.t.length = 0; volt.v.length = 0;
  buf.forEach((v, i) => { volt.t.push(tNow + (i + 1 - buf.length) / FS); volt.v.push(v * 1000); });
  lastPollT = performance.now() / 1000;
  start(() => {
    gen(Math.round(FS * POLL_MS / 1000));
    const p = Math.min(0.995, Math.max(0.5, Math.abs(touch) > 60 ? 0.6 + touch / 700 : 0.97 - Math.random() * 0.08));
    const st = Math.abs(touch) > 60 ? "접촉" : "비접촉";
    const pt = st === "접촉" ? p : 1 - p;
    ingest({
      ready: true, state: st, proba: p, classes: ["비접촉", "접촉"], probs: [1 - pt, pt],
      signal: buf.slice(-FS * 2).filter((_, i) => i % 5 === 0), signal_hz: FS / 5,
      spec: stft(), band: BAND, window_sec: WIN, sample_rate: FS, actual_rate: FS, paused: false,
    });
  });
}

/* ════════════════ 그리기 ════════════════ */
function render() { renderGauge(); renderHist(); renderSpec(); renderVolt(); }
function frame() { renderVolt(); requestAnimationFrame(frame); }
new ResizeObserver(() => { renderSpec(); renderVolt(); }).observe(document.body);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);

render();
requestAnimationFrame(frame);
if (params.get("demo") === "1") startDemo(); else { setConn("down", "연결 중…"); start(poll); }
})();
</script>
</body>
</html>
